
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f9f9f9;
      margin: 0;
    }
    h3 {
      margin-top: 0;
      color: #333;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #007AFF;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    #result {
      margin-top: 12px;
      padding: 10px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.4;
      color: #444;
      min-height: 40px;
    }
  </style>
</head>
<body>
  <h3>AI Summarizer</h3>
  <button id="runBtn">Summarize Text</button>
  <div id="result">Select text on the page and click the button.</div>
  <script src="popup.js"></script>
</body>
</html>
